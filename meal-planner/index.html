<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Meal Planner</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="meal-planner.css">
</head>

<body>
    <header>
        <h1>My Meal Plan</h1>
        <a href="../index.html" class="button">← Back to Search</a>
    </header>

    <main class="divider">
        <section class="planner-controls">
            <button id="prev-week">← Previous Week</button>
            <h2 id="week-display">Current Week: Loading...</h2>
            <button id="next-week">Next Week →</button>

            <a href="../shopping-list/index.html" class="button">Generate Shopping List 🛒</a>
        </section>

        <section id="meal-calendar" class="meal-calendar-grid">
            <p>Loading meal plan...</p>
        </section>

        <section id="available-recipes">
            <h3>Available Recipes (Your Favorites)</h3>
            <ul id="favorites-list">
                <p>Add recipes to your favorites to see them here.</p>
            </ul>
        </section>
    </main>

    <script type="module" src="../src/modules/MealPlanGenerator.js"></script>
</body>

</html>
